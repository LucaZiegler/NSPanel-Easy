# NSPanel custom UI - ESPHome package
# Generated by custom/tools/gen_package.py - edit the generator, not this file.
#
# Include from the device configuration (which keeps name, wifi, api key and ota password):
#   packages:
#     ui:
#       url: https://github.com/LucaZiegler/NSPanel-Easy
#       ref: custom-ui
#       files: [custom/nspanel_custom.yaml]
#       refresh: 0s
---
substitutions:
  device_name: NSPanel
  tft_url: "http://homeassistant.local:8123/local/nspanel/nspanel_custom.tft"
  screensaver_timeout: "30s"
  light_1: light.wohnzimmer
  light_2: light.kuche
  light_3: light.esszimmer
  light_4: light.bad
  light_5: light.schlafzimmer
  light_6: light.flur
  light_7: light.balkon
  light_8: light.pc
  light_9: light.fernseher
  light_10: light.eingangsbereich
  light_11: light.schrank
  light_12: light.0xbc33acfffe9b49ac
  scene_1: scene.kuche_wohnzimmer_normal
  scene_2: scene.kuche_wohnzimmer_gemutlich
  scene_3: scene.kuche_wohnzimmer_tv
  scene_4: scene.bad_hell
  scene_5: scene.bad_abends
  scene_6: scene.schlafzimmer_schlafen
  climate: climate.bad
  window_top: binary_sensor.kontakt_bad_fenster_oben
  window_bottom: binary_sensor.kontakt_bad_fenster_unten
  weather: weather.googleweather
  media_player: media_player.lg_webos_tv_oled55cx9la
  lock: lock.zuhause
  alarm: alarm_control_panel.alarmo
  door_script: script.tur_offnen
  tv_on_script: script.lg_turn_on
  screen_off_script: script.lg_screen_off
  out_denon_script: script.lg_audio_ouput
  out_tv_script: script.lg_audio_ouput_to_internal_audio

external_components:
  - source:
      type: git
      url: https://github.com/LucaZiegler/NSPanel-Easy
      ref: custom-ui
    components: [nspanel_ui]
    refresh: 0s

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(ui).set_action_handler([](const std::string &action, const std::string &entity,
                                         const std::string &key, const std::string &value) {
              if (key.empty()) {
                id(ui_action)->execute(action, entity);
              } else if (key == "temperature") {
                id(ui_action_temperature)->execute(entity, parse_number<float>(value).value_or(20.0f));
              } else if (key == "preset_mode") {
                id(ui_action_preset)->execute(entity, value);
              } else if (key == "hvac_mode") {
                id(ui_action_hvac)->execute(entity, value);
              } else if (key == "volume_level") {
                id(ui_action_volume)->execute(entity, parse_number<float>(value).value_or(0.2f));
              } else {
                ESP_LOGW("nspanel_ui", "Unhandled action data key %s", key.c_str());
              }
            });
            id(ui).set_event_handler([](const std::string &type, const std::string &value) {
              id(ui_event)->execute(type, value);
            });

uart:
  - id: tf_uart
    tx_pin: 16
    rx_pin: 17
    baud_rate: 921600

display:
  - platform: nextion
    id: disp
    uart_id: tf_uart
    update_interval: never
    command_spacing: 3ms
    tft_url: ${tft_url}
    on_setup:
      then:
        - lambda: id(ui).on_display_ready();
    on_touch:
      then:
        - lambda: id(ui).on_touch(page_id, component_id, touch_event);

time:
  - platform: homeassistant
    id: ha_time

nspanel_ui:
  id: ui
  display_id: disp
  time_id: ha_time
  screensaver_timeout: ${screensaver_timeout}
  lights:
    - ${light_1}
    - ${light_2}
    - ${light_3}
    - ${light_4}
    - ${light_5}
    - ${light_6}
    - ${light_7}
    - ${light_8}
    - ${light_9}
    - ${light_10}
    - ${light_11}
    - ${light_12}
  scenes:
    - ${scene_1}
    - ${scene_2}
    - ${scene_3}
    - ${scene_4}
    - ${scene_5}
    - ${scene_6}
  quick_scenes:
    - ${scene_1}
    - ${scene_2}
    - ${scene_3}
  climate: ${climate}
  media_player: ${media_player}
  lock: ${lock}
  alarm: ${alarm}
  door_script: ${door_script}
  tv_on_script: ${tv_on_script}
  screen_off_script: ${screen_off_script}
  out_denon_script: ${out_denon_script}
  out_tv_script: ${out_tv_script}

script:
  - id: ui_action
    mode: queued
    max_runs: 20
    parameters:
      action: string
      entity: string
    then:
      - homeassistant.action:
          action: !lambda return action;
          data:
            entity_id: !lambda return entity;
  - id: ui_action_temperature
    mode: queued
    max_runs: 20
    parameters:
      entity: string
      value: float
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda return entity;
            temperature: !lambda return value;
  - id: ui_action_preset
    mode: queued
    max_runs: 20
    parameters:
      entity: string
      value: string
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: !lambda return entity;
            preset_mode: !lambda return value;
  - id: ui_action_hvac
    mode: queued
    max_runs: 20
    parameters:
      entity: string
      value: string
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda return entity;
            hvac_mode: !lambda return value;
  - id: ui_action_volume
    mode: queued
    max_runs: 20
    parameters:
      entity: string
      value: float
    then:
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: !lambda return entity;
            volume_level: !lambda return value;
  - id: ui_event
    mode: queued
    parameters:
      type: string
      value: string
    then:
      - homeassistant.event:
          event: esphome.nspanel_ui
          data:
            type: !lambda return type;
            value: !lambda return value;

