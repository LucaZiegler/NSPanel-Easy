api:
  # Same action names as the old firmware, so existing automations keep working
  # (esphome.nspanel_<action>).
  actions:
    - action: upload_tft
      variables:
        url: string
      then:
        - lambda: |-
            id(ui).pause(true);
            if (!url.empty()) id(disp).set_tft_url(url);
            id(disp).upload_tft();
    - action: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda return song_str;
    - action: send_command
      variables:
        cmd: string
      then:
        - lambda: id(disp).send_command_printf("%s", cmd.c_str());
    - action: wake
      then:
        - lambda: id(ui).wake();
    - action: show_screensaver
      then:
        - lambda: id(ui).show_screensaver();
    - action: navigate_to_page
      variables:
        page: string
      then:
        - lambda: id(ui).navigate(page);
    - action: disable_screensaver
      then:
        - lambda: id(ui).set_screensaver_enabled(false);
    - action: enable_screensaver
      then:
        - lambda: id(ui).set_screensaver_enabled(true);
    - action: dim_0_to_100
      variables:
        intensity: string
      then:
        - lambda: id(ui).set_screensaver_brightness(parse_number<int>(intensity).value_or(10));
    - action: show_entity
      variables:
        entity: string
        title: string
      then:
        - lambda: |-
            if (entity.rfind("light.", 0) == 0) id(ui).navigate("licht");
            else if (entity.rfind("climate.", 0) == 0) id(ui).navigate("bad");
            else if (entity.rfind("media_player.", 0) == 0) id(ui).navigate("medien");
            else id(ui).wake();
    - action: notify_on_screensaver
      variables:
        line1: string
        line2: string
      then:
        - lambda: id(ui).notify_screensaver(line1, line2);
        - rtttl.play: "short:d=4,o=5,b=100:16e6"
    - action: notify_fullscreen
      variables:
        title: string
        description: string
        button1: string
        button2: string
        time_secs: string
      then:
        - lambda: |-
            id(ui).notify_fullscreen(title, description, button1, button2,
                                     parse_number<uint32_t>(time_secs).value_or(60));
        - rtttl.play: "scale_up:d=32,o=5,b=100:c,c#,d#,e,f#,g#,a#,b"

number:
  - platform: template
    name: ${device_name} Display Brightness
    id: display_brightness
    entity_category: config
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    on_value:
      - lambda: id(ui).set_active_brightness(static_cast<int>(x));
  - platform: template
    name: ${device_name} Screensaver Brightness
    id: screensaver_brightness
    entity_category: config
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    on_value:
      - lambda: id(ui).set_screensaver_brightness(static_cast<int>(x));

button:
  - platform: template
    name: ${device_name} Update TFT
    entity_category: config
    on_press:
      - lambda: |-
          id(ui).pause(true);
          id(disp).upload_tft();
  - platform: restart
    name: ${device_name} Restart
    entity_category: config

binary_sensor:
  - platform: gpio
    name: ${device_name} Left Button
    internal: true
    pin:
      number: 14
      inverted: true
    on_click:
      - switch.toggle: relay_1
  - platform: gpio
    name: ${device_name} Right Button
    internal: true
    pin:
      number: 27
      inverted: true
    on_click:
      - switch.toggle: relay_2

sensor:
  - platform: wifi_signal
    name: ${device_name} WiFi Signal
    update_interval: 60s
    internal: true
  - platform: ntc
    id: temperature
    sensor: resistance_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: ${device_name} Temperature
  - platform: resistance
    id: resistance_sensor
    sensor: ntc_source
    configuration: DOWNSTREAM
    resistor: 11.2kOhm
    internal: true
  - platform: adc
    id: ntc_source
    pin: 38
    update_interval: 10s
    attenuation: 12db
    internal: true

switch:
  - platform: gpio
    name: ${device_name} Relay 1
    id: relay_1
    pin:
      number: 22
  - platform: gpio
    name: ${device_name} Relay 2
    id: relay_2
    pin:
      number: 19
  - platform: gpio
    id: screen_power
    entity_category: config
    pin:
      number: 4
      inverted: true
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    id: buzzer_out
    pin:
      number: 21

rtttl:
  id: buzzer
  output: buzzer_out
